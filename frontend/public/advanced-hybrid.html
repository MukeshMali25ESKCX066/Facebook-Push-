<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Advanced Hybrid Dashboard · PageCrew</title>
  <link rel="icon" type="image/png" href="/pagecrew-logo.png">
  <link rel="stylesheet" href="/assets/index-CX7T7O2L.css">
  <link rel="stylesheet" href="/advanced-hybrid.css">
  <link rel="stylesheet" href="/standard-auto-publishing.css">
</head>
<body class="advanced-hybrid-page">
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="PageCrew dashboard">
        <img class="brand-icon" src="/pagecrew-logo.png" alt="PageCrew logo">
        <span><strong>PageCrew</strong><small>Social publishing</small></span>
      </a>
      <p class="nav-title">Workspace</p>
      <nav class="nav" aria-label="Main navigation">
        <a href="/" class="nav-link"><span aria-hidden="true">⌂</span>Dashboard</a>
        <a href="/#pages" class="nav-link"><span aria-hidden="true">▤</span>Facebook Pages</a>
        <a href="/#composer" class="nav-link"><span aria-hidden="true">＋</span>Create Post</a>
        <a href="/#manage-posts" class="nav-link"><span aria-hidden="true">▣</span>Manage Posts</a>
      </nav>
      <div class="sidebar-bottom"><a class="ah-back-link" href="/">← Back to PageCrew</a></div>
    </aside>
    <main class="main">
      <header class="topbar ah-topbar">
        <div>
          <span class="ah-eyebrow">Automatic Auto Publishing</span>
          <h1>Advanced Hybrid Dashboard</h1>
          <p>Advanced Hybrid – Starting to End Complete Flow</p>
        </div>
        <span class="ah-stage-badge">Step 1 · Dashboard</span>
      </header>
      <div class="ah-shell">
        <aside class="ah-module-sidebar">
          <p class="ah-module-title">Advanced Hybrid</p>
          <nav class="ah-module-nav" aria-label="Advanced Hybrid modules">
            <button type="button" class="ah-module-link active" data-view="overview"><span aria-hidden="true">◫</span>Overview</button>
            <button type="button" class="ah-module-link ah-primary-link" data-view="create-campaign"><span aria-hidden="true">＋</span>Create Campaign</button>
            <button type="button" class="ah-module-link" data-view="campaign-manager"><span aria-hidden="true">▤</span>Campaign Manager</button>
            <button type="button" class="ah-module-link" data-view="facebook-pages"><span aria-hidden="true">f</span>Facebook Pages</button>
            <button type="button" class="ah-module-link" data-view="url-library"><span aria-hidden="true">↗</span>URL Library</button>
            <button type="button" class="ah-module-link" data-view="image-library"><span aria-hidden="true">▧</span>Optional Image Library</button>
            <button type="button" class="ah-module-link" data-view="smart-matching"><span aria-hidden="true">⇄</span>Optional Resource Preview</button>
            <button type="button" class="ah-module-link" data-view="ai-settings"><span aria-hidden="true">✧</span>AI Captions</button>
            <button type="button" class="ah-module-link" data-view="post-preview"><span aria-hidden="true">▣</span>Post Preview</button>
            <button type="button" class="ah-module-link" data-view="publishing-settings"><span aria-hidden="true">◷</span>Campaign Schedule</button>
            <button type="button" class="ah-module-link ah-primary-link" data-view="campaign-review"><span aria-hidden="true">✓</span>Campaign Review &amp; Activate</button>
            <button type="button" class="ah-module-link" data-view="auto-publishing"><span aria-hidden="true">◷</span>Automatic Processing</button>
            <button type="button" class="ah-module-link" data-view="publishing-queue"><span aria-hidden="true">☷</span>Publishing Queue</button>
            <button type="button" class="ah-module-link" data-view="facebook-publishing"><span aria-hidden="true">f</span>Facebook Publishing</button>
            <button type="button" class="ah-module-link" data-view="publishing-history"><span aria-hidden="true">◴</span>Publishing History</button>
            <button type="button" class="ah-module-link" data-view="analytics"><span aria-hidden="true">▥</span>Analytics &amp; Optimization</button>
            <button type="button" class="ah-module-link" data-view="settings"><span aria-hidden="true">⚙</span>Campaign Management</button>
          </nav>
        </aside>
        <section id="advanced-hybrid-app" class="ah-content" aria-live="polite">
          <div class="ah-loading">Loading your campaigns…</div>
        </section>
      </div>
    </main>
  </div>
  <script src="/event-campaign-nav.js"></script>
  <script src="/advanced-hybrid.js"></script>
</body>
</html>
